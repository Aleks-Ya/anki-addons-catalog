<section id="ai" class="ai" data-query="{{ q }}" data-filters="{{ search_url('', filters).partition('?')[2] }}" data-site-key="{{ turnstile_site_key or '' }}">
  <h2>AI answer</h2>
  <div id="ai-status" class="status" aria-live="polite"><span aria-busy="true">Starting…</span></div>
  <div id="ai-turnstile"></div>
  <div id="ai-answer" class="answer"></div>
  <div id="ai-addons"></div>
  <p class="disclaimer"><small>Answers are generated by Claude from the catalog data and may contain mistakes.</small></p>
</section>
